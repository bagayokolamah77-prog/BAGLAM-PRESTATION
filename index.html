<script id="baglam-v111-cache-repair">
(function(){
  const BUILD='1.1.5', KEY='baglam_static_repair_build';
  try{
    if(localStorage.getItem(KEY)===BUILD) return;
    Promise.resolve().then(async()=>{
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.filter(k=>k.startsWith('baglam-static-')).map(k=>caches.delete(k)));
        }
      }catch(e){console.warn('BAGLAM cache repair',e)}
      try{localStorage.setItem(KEY,BUILD)}catch{}
      const u=new URL(location.href);
      if(u.searchParams.get('baglam_build')!==BUILD){u.searchParams.set('baglam_build',BUILD);location.replace(u.toString())}
    });
  }catch(e){}
})();
</script>

<!-- ==========================================================================
       STOCKAGE LOCAL OFFLINE-FIRST — IndexedDB avec migration depuis localStorage
       Conserve exactement l’API window.storage utilisée par BAGLAM.
       ========================================================================== -->
<script>
  (function(){
    const DB_NAME='baglam_offline_v1', STORE='kv', DB_VERSION=1;
    let dbPromise=null;
    function openDB(){
      if(dbPromise) return dbPromise;
      dbPromise=new Promise((resolve,reject)=>{
        if(!('indexedDB' in window)){ reject(new Error('IndexedDB indisponible')); return; }
        const req=indexedDB.open(DB_NAME,DB_VERSION);
        req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:'id'}); };
        req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
      });
      return dbPromise;
    }
    function nsKey(key,shared){ return 'storage::'+(shared?'shared':'private')+'::'+key; }
    async function idbGet(id){ const db=await openDB(); return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly'),r=tx.objectStore(STORE).get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)}); }
    async function idbPut(obj){ const db=await openDB(); return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite'),r=tx.objectStore(STORE).put(obj);r.onsuccess=()=>res(obj);r.onerror=()=>rej(r.error)}); }
    async function idbDel(id){ const db=await openDB(); return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite'),r=tx.objectStore(STORE).delete(id);r.onsuccess=()=>res(true);r.onerror=()=>rej(r.error)}); }
    async function idbListPrefix(prefix){ const db=await openDB(); return new Promise((res,rej)=>{const out=[];const tx=db.transaction(STORE,'readonly');const r=tx.objectStore(STORE).openCursor();r.onsuccess=()=>{const c=r.result;if(!c){res(out);return;}if(String(c.key).startsWith(prefix))out.push(c.value);c.continue()};r.onerror=()=>rej(r.error)}); }
    window.baglamIDB={openDB,idbGet,idbPut,idbDel,idbListPrefix};
    window.storage={
      async get(key,shared){
        const id=nsKey(key,shared);
        try{
          const rec=await idbGet(id);
          if(rec) return {key,value:rec.value,shared:!!shared};
        }catch(_){}
        try{
          const old='app_baglam_storage::'+(shared?'shared':'private')+'::'+key;
          const raw=localStorage.getItem(old);
          if(raw!==null){
            try{await idbPut({id,value:raw,updatedAt:Date.now()})}catch(_){}
            return {key,value:raw,shared:!!shared};
          }
        }catch(_){}
        return null;
      },
      async set(key,value,shared){ const id=nsKey(key,shared); try{await idbPut({id,value,updatedAt:Date.now()});}catch(_){try{localStorage.setItem('app_baglam_storage::'+(shared?'shared':'private')+'::'+key,value)}catch(__){}} return {key,value,shared:!!shared}; },
      async delete(key,shared){ const id=nsKey(key,shared); try{await idbDel(id)}catch(_){} try{localStorage.removeItem('app_baglam_storage::'+(shared?'shared':'private')+'::'+key)}catch(_){} return {key,deleted:true,shared:!!shared}; },
      async list(prefix,shared){ const pre='storage::'+(shared?'shared':'private')+'::'+(prefix||''); try{const rows=await idbListPrefix(pre);return {keys:rows.map(r=>r.id.slice(('storage::'+(shared?'shared':'private')+'::').length)),prefix:prefix||undefined,shared:!!shared}}catch(_){return {keys:[],prefix:prefix||undefined,shared:!!shared}} }
    };
  })();
  </script>
<!-- ==========================================================================
       PERFORMANCE + RÉSEAU FAIBLE + CACHE API + FILE DE SYNCHRONISATION
       ========================================================================== -->
<script>
  (function(){
    const nativeFetch=window.fetch.bind(window);
    const CFG=window.BAGLAM_CONFIG||{};
    const SUPABASE_HOST=(()=>{try{return new URL(CFG.SUPABASE_URL||'').hostname}catch(_){return ''}})();
    const API_CACHE_TTL=Number(CFG.API_CACHE_TTL_MS)||15*60*1000;
    const TIMEOUT_MS=Number(CFG.NETWORK_TIMEOUT_MS)||9000;
    const qPrefix='offline_queue::', cPrefix='http_cache::';
    const OFFLINE_WRITE_TABLES=new Set(['clients','services','paiements','depenses','inscrits','inscriptions','suivi_apprenants']);
    let syncRunning=false, latestAuth='';
    function notifyDataChanged(table,detail={}){try{if(table)window.dispatchEvent(new CustomEvent('baglam:data-changed',{detail:{table,...detail}}))}catch(_){}}
    function notifySyncComplete(tables){try{window.dispatchEvent(new CustomEvent('baglam:sync-complete',{detail:{tables:[...new Set(tables||[])]}}))}catch(_){}}
    function jwtSub(headers){
      try{const h=new Headers(headers||{}),a=h.get('authorization')||'';if(!a.startsWith('Bearer '))return 'anonymous';const p=a.slice(7).split('.')[1];const j=JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/')));return j.sub||'anonymous'}catch(_){return 'anonymous'}
    }
    function cacheId(url,headers){return cPrefix+jwtSub(headers)+'::'+url}
    async function idbPut(x){try{return await window.baglamIDB.idbPut(x)}catch(_){}}
    async function idbGet(k){try{return await window.baglamIDB.idbGet(k)}catch(_){return null}}
    async function idbDel(k){try{return await window.baglamIDB.idbDel(k)}catch(_){}}
    async function idbList(pre){try{return await window.baglamIDB.idbListPrefix(pre)}catch(_){return []}}
    async function responseToCache(resp,id){try{const text=await resp.clone().text();await idbPut({id,status:resp.status,statusText:resp.statusText,headers:Array.from(resp.headers.entries()),body:text,savedAt:Date.now()})}catch(_){}}
    function cachedResponse(r){return new Response(r.body,{status:r.status||200,statusText:r.statusText||'OK',headers:r.headers||[['content-type','application/json']]})}
    function queuedRowMatchesUrl(row,url){try{const u=new URL(url,location.href),ent=u.searchParams.get('entreprise_id'),deleted=u.searchParams.get('deleted_at');if(ent&&ent.startsWith('eq.')&&String(row?.entreprise_id||'')!==decodeURIComponent(ent.slice(3)))return false;if(deleted==='is.null'&&row?.deleted_at)return false;return true}catch(_){return true}}
    async function cachedResponseWithPending(r,url,headers){
      if(!isSupabaseRest(url))return cachedResponse(r);
      try{const base=JSON.parse(r.body||'[]');if(!Array.isArray(base))return cachedResponse(r);const table=tableFromUrl(url),owner=jwtSub(headers),items=(await idbList(qPrefix)).filter(x=>x&&x.table===table&&(!x.owner||x.owner==='anonymous'||x.owner===owner)),map=new Map(base.filter(Boolean).map(x=>[String(x.id||crypto.randomUUID()),x]));for(const item of items){let raw;try{raw=JSON.parse(item.body||'{}')}catch(_){continue}const arr=Array.isArray(raw)?raw:[raw];for(const row of arr){if(!row||typeof row!=='object')continue;if(item.method==='POST'){if(queuedRowMatchesUrl(row,url))map.set(String(row.id||item.queueId),{...row,__baglamPending:true})}else if(item.method==='PATCH'){const id=queryEqId(item.url)||row.id;if(!id)continue;const prev=map.get(String(id))||{id};const merged={...prev,...row,__baglamPending:true};if(queuedRowMatchesUrl(merged,url))map.set(String(id),merged);else map.delete(String(id))}}}const out=[...map.values()].sort((a,b)=>String(b.created_at||b.date||'').localeCompare(String(a.created_at||a.date||'')));return new Response(JSON.stringify(out),{status:r.status||200,statusText:r.statusText||'OK',headers:r.headers||[['content-type','application/json']]})}catch(_){return cachedResponse(r)}}
    function withTimeout(input,init,timeoutMs=TIMEOUT_MS){
      const ctrl=new AbortController(), timer=setTimeout(()=>ctrl.abort(new DOMException('Délai réseau dépassé','AbortError')),timeoutMs);
      const original=init&&init.signal; if(original) original.addEventListener('abort',()=>ctrl.abort(original.reason),{once:true});
      return nativeFetch(input,{...(init||{}),signal:ctrl.signal}).finally(()=>clearTimeout(timer));
    }
    function isSupabaseFunction(url){try{const u=new URL(url,location.href);return u.hostname===SUPABASE_HOST&&u.pathname.startsWith('/functions/v1/')}catch(_){return false}}
    function isSupabaseAuth(url){try{const u=new URL(url,location.href);return u.hostname===SUPABASE_HOST&&u.pathname.startsWith('/auth/v1/')}catch(_){return false}}
    function isSupabaseRest(url){try{const u=new URL(url,location.href);return u.hostname===SUPABASE_HOST&&u.pathname.startsWith('/rest/v1/')&&!u.pathname.startsWith('/rest/v1/rpc/')}catch(_){return false}}
    function isSafeReadRpc(url){try{const u=new URL(url,location.href);return u.hostname===SUPABASE_HOST&&u.pathname==='/rest/v1/rpc/get_entreprise_abonnement_statut'}catch(_){return false}}
    function canQueueOffline(url){return isSupabaseRest(url)&&OFFLINE_WRITE_TABLES.has(tableFromUrl(url))}
    function tableFromUrl(url){try{return new URL(url,location.href).pathname.split('/rest/v1/')[1].split(/[?\/]/)[0]}catch(_){return ''}}

async function baglamMemberInvoke(action,payload={}){
  const cfg=window.BAGLAM_CONFIG||{};
  const supabaseUrl=String(cfg.SUPABASE_URL||"").replace(/\/$/,"");
  const publishableKey=String(cfg.SUPABASE_PUBLISHABLE_KEY||"");
  if(!supabaseUrl||!publishableKey) throw new Error("Configuration Supabase publique manquante.");
  const endpoint=`${supabaseUrl}/functions/v1/manage-enterprise-user`;
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  async function getToken(forceRefresh=false){
    if(forceRefresh){
      const {data,error}=await H.auth.refreshSession();
      if(error) throw new Error("Impossible de renouveler votre session : "+error.message);
      return data?.session?.access_token||"";
    }
    const {data,error}=await H.auth.getSession();
    if(error) throw new Error("Impossible de lire votre session : "+error.message);
    if(data?.session?.access_token) return data.session.access_token;
    const refreshed=await H.auth.refreshSession();
    if(refreshed.error) throw new Error("Votre session a expiré. Reconnectez-vous.");
    return refreshed.data?.session?.access_token||"";
  }
  async function request(forceRefresh=false){
    const token=await getToken(forceRefresh);
    if(!token) throw new Error("Session Administrateur introuvable. Déconnectez-vous puis reconnectez-vous.");
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),45000);
    try{
      const res=await fetch(endpoint,{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":`Bearer ${token}`,
          "apikey":publishableKey,
          "x-client-info":"baglam-members-v1.0.0"
        },
        body:JSON.stringify({action,...payload}),
        signal:ctrl.signal
      });
      const raw=await res.text();
      let data={};
      try{data=raw?JSON.parse(raw):{}}catch{data={error:raw||`Réponse Supabase invalide (${res.status}).`}}
      if(res.status===401&&!forceRefresh) return request(true);
      if(!res.ok) throw new Error(data?.error||data?.message||`Erreur Supabase (${res.status}).`);
      if(data&&data.error) throw new Error(data.error);
      return data||{};
    }finally{clearTimeout(timer)}
  }
  try{
    return await request(false);
  }catch(err){
    const msg=String(err?.message||err||"");
    const network=/Failed to fetch|NetworkError|Load failed|aborted|AbortError|fetch/i.test(msg)||err?.name==="AbortError"||err instanceof TypeError;
    if(network){
      await sleep(900);
      try{return await request(true)}catch(err2){
        const msg2=String(err2?.message||err2||"");
        throw new Error("Connexion à la fonction de gestion des membres impossible après 2 essais. Vérifiez que « manage-enterprise-user » est déployée dans Supabase. Détail : "+msg2);
      }
    }
    throw err;
  }
}

    const iso = d.toISOString().slice(0, 10);
    const prestationsJour = data.prestations.filter((p) => (p.dateCommande || "").slice(0, 10) === iso);
    const servicesMap = {};
    prestationsJour.forEach((p) => {
      const s = data.services.find((x) => x.id === p.serviceId);
      const key = s ? s.nom : p.description || "Autre service";
      servicesMap[key] = (servicesMap[key] || 0) + Number(p.quantite || 1);
    });
    const services = Object.entries(servicesMap).map(([nom, quantite]) => ({ nom, quantite }));

    const finJour=baglamFinance(data,{debut:iso,fin:iso});

    const depensesJour=finJour.depensesTotal;
    const beneficeNet=finJour.benefice;
    arr.push({
      iso,
      dateLabel: d.toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit", month: "2-digit" }),
      services,
      inscriptions: inscriptionsJour.length,
      depenses: depensesJour,
      beneficeNet,
      argentRentre
    });
  }
  return arr;

  window.addEventListener('error',ev=>{if(!(document.getElementById('root')&&document.getElementById('root').children.length))console.error('BAGLAM boot error:',ev.message)});
  window.addEventListener('unhandledrejection',ev=>{if(!(document.getElementById('root')&&document.getElementById('root').children.length))console.error('BAGLAM boot rejection:',ev.reason)});
  boot();
})();
</script>
