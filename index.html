<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APP BAGLAM — Prestations (Firebase)</title>
<style>
  :root{
    --night:#060928; --night2:#090f3f; --blue:#155BFF; --cyan:#25D7FF;
    --violet:#7B2CFF; --pink:#E21887; --ink:#0b1540; --muted:#64748b;
    --line:#e2e8f0; --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; --card:#ffffff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',system-ui,Arial,sans-serif;color:var(--ink);
    background:radial-gradient(circle at 80% -5%,rgba(37,215,255,.18),transparent 40%),
               radial-gradient(circle at 0% 100%,rgba(123,44,255,.14),transparent 45%),
               linear-gradient(160deg,#eef4ff 0%,#e5edff 60%,#dbe6ff 100%);
    min-height:100vh}
  .wrap{max-width:1040px;margin:0 auto;padding:20px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--night)}
  .brand .dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--cyan));
    display:grid;place-items:center;color:#fff;font-size:15px}
  .badge{font:600 11px/1 Arial;color:#fff;background:linear-gradient(90deg,var(--blue),var(--violet));
    padding:4px 9px;border-radius:999px;margin-left:8px}
  /* ---- Auth ---- */
  .auth{min-height:100vh;display:grid;place-items:center;padding:24px}
  .auth-card{width:100%;max-width:430px;background:var(--card);border-radius:20px;
    box-shadow:0 30px 70px rgba(6,13,53,.22);padding:30px 28px;border:1px solid rgba(21,91,255,.08)}
  .tabs{display:flex;gap:6px;background:#f1f5ff;border-radius:12px;padding:5px;margin:18px 0 22px}
  .tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:600;
    color:var(--muted);cursor:pointer;font-size:13px}
  .tabs button.on{background:#fff;color:var(--blue);box-shadow:0 2px 6px rgba(6,13,53,.1)}
  label{display:block;font-size:12.5px;font-weight:600;color:#334155;margin:12px 0 6px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;font-family:inherit;background:#fbfcff}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);background:#fff}
  .btn{width:100%;margin-top:18px;border:0;border-radius:11px;padding:12px;font-weight:700;font-size:14px;
    color:#fff;background:linear-gradient(135deg,var(--blue),var(--violet));cursor:pointer}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .btn.ghost{background:#eef2ff;color:var(--blue)}
  .btn.sm{width:auto;margin:0;padding:8px 14px;font-size:13px}
  .msg{margin-top:14px;padding:11px 13px;border-radius:10px;font-size:13px;display:none}
  .msg.err{display:block;background:#fef2f2;color:var(--bad);border:1px solid #fecaca}
  .msg.ok{display:block;background:#f0fdf4;color:var(--ok);border:1px solid #bbf7d0}
  .hint{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.5}
  .link{color:var(--blue);cursor:pointer;font-weight:600}
  /* ---- App ---- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .who{font-size:13px;color:#475569}
  .who b{color:var(--night)}
  .grid{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:860px){.grid{grid-template-columns:380px 1fr}}
  .panel{background:var(--card);border-radius:16px;padding:20px;border:1px solid rgba(21,91,255,.08);
    box-shadow:0 14px 34px rgba(6,13,53,.08)}
  .panel h2{margin:0 0 14px;font-size:15px}
  .kpi{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .kpi .box{flex:1;min-width:120px;background:linear-gradient(135deg,var(--night),var(--night2));
    color:#fff;border-radius:14px;padding:14px}
  .kpi .box .n{font-size:22px;font-weight:800}
  .kpi .box .l{font-size:11px;opacity:.8;margin-top:2px}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{border:1px solid var(--line);border-radius:12px;padding:13px 14px;display:flex;gap:10px;
    justify-content:space-between;align-items:flex-start}
  .item .t{font-weight:700;font-size:14px}
  .item .s{font-size:12px;color:var(--muted);margin-top:3px}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .pill.cours{background:#eff6ff;color:var(--blue)}
  .pill.fini{background:#f0fdf4;color:var(--ok)}
  .pill.attente{background:#fffbeb;color:var(--warn)}
  .amount{font-weight:800;font-size:14px;white-space:nowrap}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .acts{display:flex;gap:6px;margin-top:4px}
  .icon{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;cursor:pointer;font-size:12px}
  .icon:hover{border-color:var(--blue);color:var(--blue)}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13px}
  .loading{min-height:100vh;display:grid;place-items:center;color:var(--night);font-weight:700}
  .spin{width:34px;height:34px;border:4px solid rgba(21,91,255,.2);border-top-color:var(--blue);
    border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"><div class="loading"><div><div class="spin"></div>Chargement…</div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword,
         createUserWithEmailAndPassword, signOut, sendPasswordResetEmail, updateProfile }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, getDoc, getDocs, setDoc,
         updateDoc, deleteDoc, query, where, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== TA CONFIG FIREBASE (projet baglam-prestation) ====== */
const firebaseConfig = {
  apiKey: "AIzaSyA41xo6mAsmsQLiRiKH_tm2_SzZ8sKGFYw",
  authDomain: "baglam-prestation.firebaseapp.com",
  databaseURL: "https://baglam-prestation-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "baglam-prestation",
  storageBucket: "baglam-prestation.firebasestorage.app",
  messagingSenderId: "368413953648",
  appId: "1:368413953648:web:a51c7b540998e8a27e2eb5"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const root = document.getElementById("root");
const esc  = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt  = (n, d="GNF") => (Number(n)||0).toLocaleString("fr-FR") + " " + d;

let currentUser = null;
let profile = null;

/* ========================= AUTH SCREEN ========================= */
function renderAuth(tab = "login") {
  root.innerHTML = `
  <div class="auth"><div class="auth-card">
    <div class="brand"><span class="dot">B</span> APP BAGLAM <span class="badge">Firebase</span></div>
    <div class="tabs">
      <button data-t="login"   class="${tab==='login'?'on':''}">Connexion</button>
      <button data-t="founder" class="${tab==='founder'?'on':''}">Compte fondateur</button>
      <button data-t="reset"   class="${tab==='reset'?'on':''}">Mot de passe oublié</button>
    </div>
    <form id="f">
      ${tab==='founder' ? `<label>Nom complet</label><input id="nom" placeholder="Ton nom" required>` : ``}
      <label>Email</label><input id="email" type="email" placeholder="toi@exemple.com" required autocomplete="username">
      ${tab!=='reset' ? `<label>Mot de passe</label><input id="pwd" type="password" placeholder="••••••••" required autocomplete="current-password">` : ``}
      <button class="btn" id="go" type="submit">
        ${tab==='login'?'Se connecter':tab==='founder'?'Créer mon compte fondateur':'Envoyer le lien de réinitialisation'}
      </button>
      <div class="msg" id="msg"></div>
    </form>
    ${tab==='founder'
      ? `<div class="hint">À utiliser <b>une seule fois</b> pour recréer ton accès de fondateur (rôle Concepteur). Après, connecte-toi via l'onglet <b>Connexion</b>.</div>`
      : tab==='login'
      ? `<div class="hint">Première fois ? Crée ton accès via l'onglet <span class="link" id="toF">Compte fondateur</span>.</div>`
      : `<div class="hint">Tu recevras un email de Firebase pour choisir un nouveau mot de passe.</div>`}
  </div></div>`;

  root.querySelectorAll(".tabs button").forEach(b => b.onclick = () => renderAuth(b.dataset.t));
  const toF = document.getElementById("toF"); if (toF) toF.onclick = () => renderAuth("founder");
  const msg = document.getElementById("msg");
  const show = (t, ok=false) => { msg.className = "msg " + (ok?"ok":"err"); msg.textContent = t; };

  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    const go = document.getElementById("go"); go.disabled = true;
    const email = document.getElementById("email").value.trim().toLowerCase();
    try {
      if (tab === "reset") {
        await sendPasswordResetEmail(auth, email);
        show("Email envoyé ✓ Vérifie ta boîte (et les spams).", true);
      } else if (tab === "founder") {
        const nom = document.getElementById("nom").value.trim();
        const pwd = document.getElementById("pwd").value;
        const cred = await createUserWithEmailAndPassword(auth, email, pwd);
        if (nom) { try { await updateProfile(cred.user, { displayName: nom }); } catch(_){} }
        await setDoc(doc(db, "profils", cred.user.uid), {
          nom, email, role: "Concepteur", actif: true, createdAt: serverTimestamp()
        });
        /* onAuthStateChanged prend le relais */
      } else {
        const pwd = document.getElementById("pwd").value;
        await signInWithEmailAndPassword(auth, email, pwd);
      }
    } catch (err) {
      show(traduire(err?.code || err?.message || "Erreur inconnue"));
      go.disabled = false;
    }
  };
}

function traduire(code) {
  const m = {
    "auth/invalid-credential":"Email ou mot de passe incorrect.",
    "auth/invalid-email":"Email invalide.",
    "auth/user-not-found":"Aucun compte avec cet email.",
    "auth/wrong-password":"Mot de passe incorrect.",
    "auth/email-already-in-use":"Un compte existe déjà avec cet email — utilise l'onglet Connexion.",
    "auth/weak-password":"Mot de passe trop court (6 caractères minimum).",
    "auth/too-many-requests":"Trop de tentatives. Réessaie dans quelques minutes.",
    "auth/network-request-failed":"Problème de connexion Internet."
  };
  return m[code] || code;
}

/* ========================= APP SCREEN ========================= */
async function loadProfile(uid) {
  try { const s = await getDoc(doc(db, "profils", uid)); return s.exists() ? s.data() : null; }
  catch { return null; }
}

async function loadPrestations(uid) {
  const q = query(collection(db, "prestations"), where("ownerId", "==", uid));
  const snap = await getDocs(q);
  const arr = [];
  snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
  arr.sort((a,b) => (b.createdAtMs||0) - (a.createdAtMs||0));
  return arr;
}

function statutPill(s){
  const k = s==="Terminée"?"fini":s==="En attente"?"attente":"cours";
  return `<span class="pill ${k}">${esc(s||"En cours")}</span>`;
}

async function renderApp() {
  root.innerHTML = `
  <div class="wrap">
    <div class="top">
      <div class="brand"><span class="dot">B</span> APP BAGLAM <span class="badge">Firebase</span></div>
      <div style="display:flex;align-items:center;gap:12px">
        <div class="who">Connecté : <b>${esc(profile?.nom || currentUser.email)}</b> · ${esc(profile?.role||"Utilisateur")}</div>
        <button class="btn sm ghost" id="out">Déconnexion</button>
      </div>
    </div>
    <div class="grid">
      <div class="panel">
        <h2>➕ Nouvelle prestation</h2>
        <form id="pf">
          <label>Intitulé *</label><input id="titre" required placeholder="Ex. Installation panneaux solaires">
          <label>Client</label><input id="client" placeholder="Nom du client">
          <div class="row">
            <div><label>Montant</label><input id="montant" type="number" step="any" placeholder="0"></div>
            <div><label>Devise</label>
              <select id="devise"><option>GNF</option><option>USD</option><option>EUR</option></select></div>
          </div>
          <label>Statut</label>
          <select id="statut"><option>En cours</option><option>En attente</option><option>Terminée</option></select>
          <div class="row">
            <div><label>Début</label><input id="debut" type="date"></div>
            <div><label>Fin</label><input id="fin" type="date"></div>
          </div>
          <label>Description</label><textarea id="desc" rows="2" placeholder="Détails…"></textarea>
          <button class="btn" id="save" type="submit">Enregistrer la prestation</button>
          <div class="msg" id="pmsg"></div>
        </form>
      </div>
      <div class="panel">
        <div class="kpi" id="kpi"></div>
        <h2>📋 Mes prestations</h2>
        <div id="list" class="list"><div class="empty">Chargement…</div></div>
      </div>
    </div>
  </div>`;

  document.getElementById("out").onclick = () => signOut(auth);
  const pmsg = document.getElementById("pmsg");
  let editId = null;

  document.getElementById("pf").onsubmit = async (e) => {
    e.preventDefault();
    const save = document.getElementById("save"); save.disabled = true;
    const data = {
      titre:    document.getElementById("titre").value.trim(),
      client:   document.getElementById("client").value.trim(),
      montant:  Number(document.getElementById("montant").value) || 0,
      devise:   document.getElementById("devise").value,
      statut:   document.getElementById("statut").value,
      debut:    document.getElementById("debut").value || null,
      fin:      document.getElementById("fin").value || null,
      description: document.getElementById("desc").value.trim(),
      ownerId:  currentUser.uid,
    };
    try {
      if (editId) {
        await updateDoc(doc(db, "prestations", editId), data);
      } else {
        await addDoc(collection(db, "prestations"), {
          ...data, createdAt: serverTimestamp(), createdAtMs: Date.now()
        });
      }
      e.target.reset(); editId = null;
      document.getElementById("save").textContent = "Enregistrer la prestation";
      pmsg.className = "msg ok"; pmsg.textContent = "Enregistré ✓";
      await refresh();
    } catch (err) {
      pmsg.className = "msg err";
      pmsg.textContent = "Échec : " + (err?.message || err);
    }
    save.disabled = false;
  };

  async function refresh() {
    const list = document.getElementById("list");
    try {
      const items = await loadPrestations(currentUser.uid);
      const total = items.reduce((s,p)=>s+(Number(p.montant)||0),0);
      const cours = items.filter(p=>p.statut==="En cours").length;
      document.getElementById("kpi").innerHTML = `
        <div class="box"><div class="n">${items.length}</div><div class="l">Prestations</div></div>
        <div class="box"><div class="n">${cours}</div><div class="l">En cours</div></div>
        <div class="box"><div class="n" style="font-size:16px">${fmt(total)}</div><div class="l">Montant total</div></div>`;
      if (!items.length) { list.innerHTML = `<div class="empty">Aucune prestation pour l'instant.<br>Crée la première avec le formulaire ✍️</div>`; return; }
      list.innerHTML = items.map(p => `
        <div class="item">
          <div>
            <div class="t">${esc(p.titre)}</div>
            <div class="s">${esc(p.client||"—")} ${p.debut?("· "+esc(p.debut)):""}${p.fin?(" → "+esc(p.fin)):""}</div>
            ${p.description?`<div class="s">${esc(p.description)}</div>`:""}
            <div class="acts">
              <span class="icon" data-ed="${p.id}">✏️ Modifier</span>
              <span class="icon" data-del="${p.id}">🗑️ Supprimer</span>
            </div>
          </div>
          <div style="text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end">
            ${statutPill(p.statut)}
            <span class="amount">${fmt(p.montant, p.devise)}</span>
          </div>
        </div>`).join("");

      list.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
        if (!confirm("Supprimer cette prestation ?")) return;
        await deleteDoc(doc(db, "prestations", b.dataset.del)); await refresh();
      });
      list.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => {
        const p = items.find(x => x.id === b.dataset.ed); if (!p) return;
        editId = p.id;
        document.getElementById("titre").value   = p.titre||"";
        document.getElementById("client").value  = p.client||"";
        document.getElementById("montant").value = p.montant||"";
        document.getElementById("devise").value  = p.devise||"GNF";
        document.getElementById("statut").value  = p.statut||"En cours";
        document.getElementById("debut").value   = p.debut||"";
        document.getElementById("fin").value     = p.fin||"";
        document.getElementById("desc").value    = p.description||"";
        document.getElementById("save").textContent = "Mettre à jour";
        window.scrollTo({top:0,behavior:"smooth"});
      });
    } catch (err) {
      list.innerHTML = `<div class="empty">Erreur de chargement : ${esc(err?.message||err)}<br>
        (Vérifie que les règles Firestore autorisent la lecture — voir README.)</div>`;
    }
  }
  await refresh();
}

/* ========================= ROUTEUR ========================= */
onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if (!user) { profile = null; renderAuth("login"); return; }
  profile = await loadProfile(user.uid);
  renderApp();
});
</script>
</body>
</html>
